    <g fill="#5c4531"><path d="M445 450h75v64h-75zM454 459l57 47M511 459l-57 47"/></g>
    <g fill="#5c4531"><path d="M1290 535h78v66h-78zM1298 543l62 50M1360 543l-62 50"/></g>
    <g fill="#544332"><path d="M110 560l30-28 36 12 16 40-28 28-45-9zM360 520l22-30 35 9 13 37-29 23-35-10zM1135 435l30-24 38 18 5 34-27 24-43-14z"/></g>
  </g>
  <!-- Wall damage and exposed rubble -->
  <path d="M735 100l22 12-15 18 24 10-20 19 22 15-21 17 14 20-24 18 15 18-27 12" fill="none" stroke="#d0a16a" stroke-width="7" opacity=".7"/>
  <path d="M100 595l24-13 18 15 22-12 18 15 22-10" fill="none" stroke="#a9794d" stroke-width="7" opacity=".65"/>
  <path d="M1470 360l-18 25 16 17-19 23 20 21-14 24 18 19" fill="none" stroke="#a9794d" stroke-width="7" opacity=".65"/>

  <rect x="925" y="125" width="550" height="200" fill="url(#tile)"/>
  <path d="M900 100H1500M900 100V210M900 285V350M900 338H1085M1205 338H1500M1488 100V350" fill="none" stroke="#8c7051" stroke-width="24"/>

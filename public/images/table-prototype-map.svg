<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-label="Ruined tavern courtyard battle map">
  <defs>
    <pattern id="stone" width="96" height="72" patternUnits="userSpaceOnUse">
      <rect width="96" height="72" fill="#292a2a"/>
      <path d="M0 1H96M0 36H96M0 71H96M48 1V36M18 36V71M79 36V71" stroke="#3b3935" stroke-width="3"/>
      <path d="M5 5h34M56 41h17M26 63h20" stroke="#51463c" stroke-width="2" opacity=".45"/>
    </pattern>
    <pattern id="planks" width="70" height="30" patternUnits="userSpaceOnUse">
      <rect width="70" height="30" fill="#47352b"/><path d="M0 1H70M0 29H70M32 1V29" stroke="#76553b" stroke-width="2" opacity=".7"/>
    </pattern>
    <pattern id="tile" width="54" height="54" patternUnits="userSpaceOnUse">
      <rect width="54" height="54" fill="#34302d"/><path d="M27 0V54M0 27H54" stroke="#45403a" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0c0b09" flood-opacity=".65"/></filter>
  </defs>
  <!-- Foundation and open-air courtyard -->
  <rect x="80" y="80" width="1440" height="960" rx="12" fill="#151514" stroke="#77634c" stroke-width="18"/>
  <rect x="100" y="100" width="1400" height="920" fill="url(#stone)"/>
  <rect x="480" y="370" width="650" height="410" fill="#33332d" stroke="#716047" stroke-width="10"/>

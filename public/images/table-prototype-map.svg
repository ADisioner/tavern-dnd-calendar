    <rect x="235" y="180" width="365" height="68" rx="8" fill="#5b402e" stroke="#b37b47" stroke-width="9"/>
    <path d="M260 216H575" stroke="#d29a5f" stroke-width="5" opacity=".7"/>
    <rect x="290" y="270" width="102" height="42" rx="12" fill="#76543b" stroke="#a8794c" stroke-width="6"/>
    <rect x="455" y="270" width="102" height="42" rx="12" fill="#76543b" stroke="#a8794c" stroke-width="6"/>
    <ellipse cx="615" cy="510" rx="67" ry="42" fill="#62452f" stroke="#af7c4c" stroke-width="8" transform="rotate(-8 615 510)"/>
    <ellipse cx="1010" cy="480" rx="54" ry="36" fill="#674a32" stroke="#b17d4b" stroke-width="8" transform="rotate(11 1010 480)"/>
    <rect x="650" y="860" width="140" height="76" rx="5" fill="#59412f" stroke="#a87746" stroke-width="8" transform="rotate(4 720 898)"/>
    <rect x="920" y="875" width="118" height="66" rx="5" fill="#59412f" stroke="#a87746" stroke-width="8" transform="rotate(-5 979 908)"/>
  </g>

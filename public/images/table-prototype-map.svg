  <g fill="#8a755c" opacity=".55"><path d="M455 570l20-14 18 18-23 12zM1160 580l18-17 22 8-11 20zM540 845l17-13 15 19-22 8zM1080 700l18-16 19 13-18 14zM430 720l15-11 17 14-19 12zM1160 930l19-16 15 18-22 11z"/></g>
</svg>
